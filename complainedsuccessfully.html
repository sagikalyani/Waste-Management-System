<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Submitted</title>
    <link rel="stylesheet" href="style3.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
            margin: 0; /* Reset default margin */
        }

        .outer-container {
            background-color: #ECDFCC; /* Background for the outer container */
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Soft shadow */
            max-width: 600px; /* Limit width */
            margin: auto; /* Center the container */
            padding: 20px; /* Inner padding */
        }

        h1 {
            color: #5f0730;
            margin-bottom: 20px; /* Space below the heading */
        }

        p {
            font-size: 16px; /* Adjusted font size */
            color: #333;
            margin-bottom: 15px; /* Space between paragraphs */
        }

        a {
            display: inline-block;
            margin: 10px 5px; /* Reduced margin for links */
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s; /* Smooth hover transition */
        }

        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="outer-container">
        <h1>Complaint Submitted Successfully!</h1>
        <p>Your complaint has been reported. Our team will review the details and take necessary actions.</p>
        <p>Thank you for helping us keep the community clean and safe.</p>
        
        <a href="index1.html">Return to Home</a>
        <a href="trackcomplaints.html">View Submitted Complaints</a>
    </div>

</body>
</html>
